name: Final VCE chemistry layout recheck

on:
  push:
    branches:
      - codex/episodes-07-14-narration
    paths:
      - energy_fuels_calorimetry/scenes/ep07.py
      - energy_fuels_calorimetry/scenes/ep13.py
      - energy_fuels_calorimetry/scenes/ep14.py
      - energy_fuels_calorimetry/shared/active_question.py
      - energy_fuels_calorimetry/shared/workshop.py
      - .github/workflows/chemistry-layout-final-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chemistry-layout-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revised-episode:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        episode: [E07, E13, E14]
    defaults:
      run:
        working-directory: energy_fuels_calorimetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and lint Python
        run: python -m compileall -q scenes shared tools checks
      - name: Install Manim, TeX, fonts and FFmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config dvisvgm texlive-xetex texlive-latex-extra texlive-science texlive-fonts-recommended fonts-inter fonts-dejavu fonts-noto-core
          python -m pip install -r requirements.txt
          echo "MANIM_BIN=$(command -v manim)" >> "$GITHUB_ENV"
      - name: Verify VCE chemistry numerics and questions
        run: |
          python checks/verify_anchors.py
          python checks/verify_question_visuals.py
          python tools/lint_scripts.py
      - name: Render complete revised 1080p visual episode
        run: python tools/render.py ${{ matrix.episode }} -q h --jobs 2 --no-assemble
      - name: Assemble and validate 1080p output
        run: |
          python tools/assemble.py ${{ matrix.episode }} -q h
          python tools/package_preview.py ${{ matrix.episode }} --tag 1080p30
          python tools/verify_previews.py ${{ matrix.episode }} --tag 1080p30
      - name: Save independently verifiable movie and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revised-layout-${{ matrix.episode }}-${{ github.run_number }}
          retention-days: 14
          compression-level: 1
          path: |
            energy_fuels_calorimetry/delivery/${{ matrix.episode }}
            energy_fuels_calorimetry/checks/preview_validation_20261005.json
            energy_fuels_calorimetry/logs/render_${{ matrix.episode }}*
            energy_fuels_calorimetry/logs/assemble_${{ matrix.episode }}*
