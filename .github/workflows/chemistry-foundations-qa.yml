name: Chemistry foundational episodes visual QA

on:
  push:
    branches: [codex/episodes-07-14-narration]
    paths:
      - '.github/workflows/chemistry-foundations-qa.yml'
      - 'energy_fuels_calorimetry/scenes/ep01.py'
      - 'energy_fuels_calorimetry/scenes/ep02.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        episode: [E01, E02]
    defaults:
      run:
        working-directory: energy_fuels_calorimetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and verify original Chemistry content
        run: |
          python -m compileall -q scenes shared tools checks
          python checks/verify_anchors.py
          python checks/verify_question_visuals.py
          python tools/lint_scripts.py
      - name: Install Manim graphics tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config dvisvgm texlive-xetex texlive-latex-extra texlive-science texlive-fonts-recommended fonts-inter fonts-dejavu fonts-noto-core
          python -m pip install -r requirements.txt
          echo "MANIM_BIN=$(command -v manim)" >> "$GITHUB_ENV"
      - name: Render source visual 1920x1080, 30fps
        run: python tools/render.py ${{ matrix.episode }} -q h --jobs 2 --no-assemble
      - name: Assemble strictly silent visual preview
        run: |
          python tools/assemble.py ${{ matrix.episode }} -q h
          python tools/package_preview.py ${{ matrix.episode }} --tag 1080p30
          python tools/verify_previews.py ${{ matrix.episode }} --tag 1080p30
      - name: Retain preview separately from private narrated deliverables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundational-visual-${{ matrix.episode }}-${{ github.run_number }}
          retention-days: 14
          compression-level: 1
          path: |
            energy_fuels_calorimetry/delivery/${{ matrix.episode }}
            energy_fuels_calorimetry/logs/render_${{ matrix.episode }}*
            energy_fuels_calorimetry/logs/assemble_${{ matrix.episode }}*
