name: Chemistry equation packages
on:
  push:
    branches: [codex/chemistry-local-runtime-20261005]
    paths: [.github/workflows/chemistry-local-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tex:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-science
          tar czf chemistry-tex.tar.gz -C /usr/share/texlive/texmf-dist tex/latex/mhchem tex/latex/siunitx
      - uses: actions/upload-artifact@v4
        with:
          name: chemistry-equation-packages
          path: chemistry-tex.tar.gz
          retention-days: 3
